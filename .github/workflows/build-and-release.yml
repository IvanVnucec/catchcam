name: build-and-release
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.vscode/**'
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  BUILD_TYPE: Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout catchcam
      uses: actions/checkout@v4
      with:
        path: catchcam
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get install -y cmake gcc-arm-none-eabi

    - name: Checkout pico-sdk/develop
      uses: actions/checkout@v4
      with:
        repository: raspberrypi/pico-sdk
        ref: develop
        path: pico-sdk
        submodules: recursive

    - name: Update camera list
      run: python3 ${{github.workspace}}/catchcam/scripts/fetch_cameras/fetch.py ${{github.workspace}}/catchcam/src/cams/cams_list.h

    - name: Create Build Environment
      working-directory: ${{github.workspace}}/catchcam
      run:  cmake -E make_directory ${{github.workspace}}/catchcam/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/catchcam/build
      run: PICO_SDK_PATH=../../pico-sdk cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{github.workspace}}/catchcam/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE --parallel $(nproc)

    - name: Commit and push changes
      working-directory: ${{github.workspace}}/catchcam
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add ${{github.workspace}}/catchcam/src/cams/cams_list.h
        git diff-index --quiet HEAD || git commit -m "Update cameras list"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: catchcam.uf2
        path: ${{github.workspace}}/catchcam/build/catchcam.uf2

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        draft: false
        files: ${{github.workspace}}/catchcam/build/catchcam.uf2
