name: build-and-release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

env:
  BUILD_TYPE: Release

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update camera list
        run: python3 ${{github.workspace}}/scripts/fetch_cameras/fetch.py ${{github.workspace}}/src/cams/cams_list.h

      - name: Setup Pico SDK
        run: |
          wget https://raw.githubusercontent.com/raspberrypi/pico-setup/4567073441c6ef298988baf49a8700f507c3b5a0/pico_setup.sh
          chmod +x pico_setup.sh
          SKIP_OPENOCD=1 SKIP_VSCODE=1 SKIP_UART=1 ./pico_setup.sh

      - name: Create build directory
        run: mkdir -p ${{github.workspace}}/build

      - name: Configure CMake
        working-directory: ${{github.workspace}}/build
        run: cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        id: build
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config $BUILD_TYPE --parallel $(nproc)

      - name: Commit and push changes
        if: steps.build.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ${{github.workspace}}/src/cams/cams_list.h
          git diff-index --quiet HEAD || git commit -m "Update cameras list"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: catchcam.uf2
          path: ${{github.workspace}}/build/catchcam.uf2

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: ${{github.workspace}}/build/catchcam.uf2